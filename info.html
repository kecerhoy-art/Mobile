<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BCA mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: url("info.jpg") no-repeat center center fixed;
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }
        .menu-item {
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }
        .menu-item:active {
            transform: scale(0.95);
            opacity: 0.8;
        }
        .icon-box {
            background: linear-gradient(145deg, rgba(0, 115, 207, 0.9), rgba(0, 89, 170, 0.9));
            border-radius: 14px;
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 5px rgba(0,0,0,0.15);
        }
        .icon-box i {
            font-size: 24px;
            color: white;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="px-4 py-3 flex justify-between items-center">
        <h1 class="text-xl font-bold text-white">BCA<span class="text-green-300">mobile</span></h1>
        <div class="flex items-center gap-3 text-white text-lg">
            <i class="fa-solid fa-square text-green-400 text-xs"></i>
            <i class="fa-solid fa-bell"></i>
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </div>
    </div>

    <!-- Selamat Datang -->
    <div class="text-center mt-3 mb-6">
        <p class="text-base">Selamat datang</p>
        <div class="flex justify-center gap-16 mt-2 text-lg font-semibold">
            <span>OOM ROSMAWATI</span>
        </div>
    </div>

    <!-- Menu Grid -->
    <div class="px-4">
        <!-- Baris 1 -->
        <div class="grid grid-cols-3 gap-4 mb-5">
            <div class="menu-item flex flex-col items-center" onclick="bukaHalaman('saldo.html')">
                <div class="icon-box mb-2">
                    <i class="fa-solid fa-layer-group"></i>
                </div>
                <span class="text-xs">m-Info</span>
            </div>
            <div class="menu-item flex flex-col items-center" onclick="bukaHalaman('blokir tf.html')">
                <div class="icon-box mb-2">
                    <i class="fa-solid fa-right-left"></i>
                </div>
                <span class="text-xs">m-Transfer</span>
            </div>
            <div class="menu-item flex flex-col items-center" onclick="bukaHalaman('blokir.html')">
                <div class="icon-box mb-2">
                    <i class="fa-solid fa-money-bill-wave"></i>
                </div>
                <span class="text-xs">m-Payment</span>
            </div>
        </div>

        <!-- Baris 2 -->
        <div class="grid grid-cols-3 gap-4 mb-5">
            <div class="menu-item flex flex-col items-center" onclick="bukaHalaman('blokir.html')">
                <div class="icon-box mb-2">
                    <i class="fa-solid fa-cart-shopping"></i>
                </div>
                <span class="text-xs">m-Commerce</span>
            </div>
            <div class="menu-item flex flex-col items-center" onclick="bukaHalaman('blokir.html')">
                <div class="icon-box mb-2">
                    <i class="fa-solid fa-money-bill-transfer"></i>
                </div>
                <span class="text-xs">Setor Tarik</span>
            </div>
            <div class="menu-item flex flex-col items-center" onclick="bukaHalaman('blokir.html')">
                <div class="icon-box mb-2">
                    <i class="fa-solid fa-qrcode"></i>
                </div>
                <span class="text-xs">QR</span>
            </div>
        </div>

        <!-- Baris 3 -->
        <div class="grid grid-cols-3 gap-4">
            <div class="menu-item flex flex-col items-center" onclick="bukaHalaman('blokir.html')">
                <div class="icon-box mb-2">
                    <i class="fa-solid fa-user-gear"></i>
                </div>
                <span class="text-xs">m-Admin</span>
            </div>
            <div class="menu-item flex flex-col items-center col-span-2" onclick="bukaHalaman('blokir.html')">
                <div class="flex flex-col items-center">
                    <div class="icon-box mb-2">
                        <i class="fa-solid fa-keyboard"></i>
                    </div>
                    <span class="text-xs text-center">Aktivasi BCA<br>Keyboard</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // === UBAH NAMA FILE TUJUAN DI SINI ===
        function bukaHalaman(tujuan) {
            window.location.href = tujuan;
        }
    </script>
</body>
</html>
